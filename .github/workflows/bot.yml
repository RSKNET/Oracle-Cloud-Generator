name: OCI ARM Host Capacity Bot

on:
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions
  schedule:
    - cron: '*/5 * * * *' # Berjalan otomatis setiap 5 menit
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest
    name: Run OCI Bot (PHP 8.3)
    env:
      OCI_KEY_PATH: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress

      - name: Setup Private Key
        env:
          KEY_INPUT: ${{ secrets.OCI_PRIVATE_KEY || secrets.OCI_PRIVATE_KEY_FILENAME }}
        run: |
          if echo "$KEY_INPUT" | grep -q -- "-----BEGIN"; then
            echo "$KEY_INPUT" > /tmp/oci_api_key.pem
            chmod 600 /tmp/oci_api_key.pem
            echo "OCI_KEY_PATH=/tmp/oci_api_key.pem" >> $GITHUB_ENV
          else
            echo "OCI_KEY_PATH=$KEY_INPUT" >> $GITHUB_ENV
          fi

      - name: Run bot script
        run: |
          php index.php
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: ${{ env.OCI_KEY_PATH }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS || '2' }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS || '12' }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE || 'VM.Standard.A1.Flex' }}
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES || '1' }}
          OCI_BOOT_VOLUME_SIZE_IN_GBS: ${{ secrets.OCI_BOOT_VOLUME_SIZE_IN_GBS || '200' }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_BOT_API_KEY: ${{ secrets.TELEGRAM_BOT_API_KEY }}
          CACHE_AVAILABILITY_DOMAINS: ${{ secrets.CACHE_AVAILABILITY_DOMAINS || '1' }}
          TOO_MANY_REQUESTS_TIME_WAIT: ${{ secrets.TOO_MANY_REQUESTS_TIME_WAIT || '600' }}


